services:
  - type: web
    name: weather-routing-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn weather_routing.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: weather_routing.settings
      - key: PYTHON_VERSION
        value: 3.11.9
